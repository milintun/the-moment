services:
  mongo:
    image: docker.io/library/mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    volumes:
      - mongo-data:/data/db

  # Local S3-compatible file storage (RustFS), standing in for the platform's S3 storage.
  # API at http://127.0.0.1:9000, web console at http://127.0.0.1:9001 (dev / devpassword).
  storage:
    image: docker.io/rustfs/rustfs:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: dev
      RUSTFS_SECRET_KEY: devpassword
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data

  # Runs once: creates the app's bucket (and one for tests) if missing and lets the local
  # frontend (and the end-to-end tests, on the test bucket) upload from the browser (CORS),
  # then exits.
  storage-setup:
    image: docker.io/amazon/aws-cli:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: devpassword
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://storage:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://storage:9000 s3 mb s3://the-moment 2>/dev/null;
      aws --endpoint-url http://storage:9000 s3 mb s3://the-moment-test 2>/dev/null;
      aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket the-moment --cors-configuration
      '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://127.0.0.1:8080\",\"http://127.0.0.1:3000\",\"http://localhost:8080\"],\"AllowedMethods\":[\"GET\",\"PUT\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3000}]}';
      aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket the-moment-test --cors-configuration
      '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://127.0.0.1:4173\"],\"AllowedMethods\":[\"GET\",\"PUT\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3000}]}'"

  backend:
    build: .
    command: bun src/main.ts
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URL: mongodb://dev:dev@mongo:27017/myapp?authSource=admin
      S3_ACCESS_KEY_ID: dev
      S3_SECRET_ACCESS_KEY: devpassword
      S3_REGION: us-east-1
      S3_BUCKET: the-moment
      # The backend reaches MinIO inside the container network; browsers reach it on localhost.
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
    depends_on:
      - mongo
      - storage-setup

  frontend:
    build: .
    command: bun web/server.ts
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  mongo-data:
  storage-data:
